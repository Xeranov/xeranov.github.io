<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050e1e"/>
      <stop offset="55%" stop-color="#0b2a56"/>
      <stop offset="100%" stop-color="#0e3f82"/>
    </linearGradient>
    <linearGradient id="fwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d4a8c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#051830"/>
    </linearGradient>
    <linearGradient id="fvign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="30%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(2,8,20,0.75)"/>
    </linearGradient>
    <radialGradient id="fmoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d0e0f8"/>
      <stop offset="100%" stop-color="#a0c0e8" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="fglint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(150,210,255,0.3)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="320" fill="url(#fsky)"/>

  <!-- Stars -->
  <circle cx="46" cy="38" r="1.4" fill="white" opacity="0.65"/>
  <circle cx="112" cy="18" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="185" cy="52" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="340" cy="28" r="0.9" fill="white" opacity="0.45"/>
  <circle cx="440" cy="14" r="1.4" fill="white" opacity="0.6"/>
  <circle cx="510" cy="44" r="0.9" fill="white" opacity="0.55"/>
  <circle cx="575" cy="22" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="260" cy="10" r="1" fill="white" opacity="0.4"/>
  <circle cx="70" cy="72" r="0.8" fill="white" opacity="0.35"/>
  <circle cx="390" cy="58" r="1" fill="white" opacity="0.5"/>

  <!-- Moon -->
  <circle cx="490" cy="58" r="26" fill="url(#fmoon)" opacity="0.88"/>
  <circle cx="502" cy="52" r="21" fill="#0b2a56"/>
  <circle cx="490" cy="58" r="40" fill="none" stroke="rgba(200,225,255,0.12)" stroke-width="1.5"/>

  <!-- Water reflection glow -->
  <ellipse cx="300" cy="200" rx="200" ry="28" fill="url(#fglint)"/>

  <!-- Water surface -->
  <path d="M0,185 Q75,173 150,183 Q225,193 300,183 Q375,173 450,183 Q525,193 600,183 L600,320 L0,320 Z" fill="url(#fwater)"/>

  <!-- Water ripples -->
  <path d="M70,192 Q115,186 160,192" stroke="rgba(140,200,255,0.28)" stroke-width="1.5" fill="none"/>
  <path d="M210,197 Q275,190 340,197" stroke="rgba(140,200,255,0.22)" stroke-width="1.2" fill="none"/>
  <path d="M370,193 Q425,187 480,193" stroke="rgba(140,200,255,0.28)" stroke-width="1.5" fill="none"/>
  <path d="M100,210 Q155,205 210,210" stroke="rgba(140,200,255,0.15)" stroke-width="1" fill="none"/>
  <path d="M290,215 Q355,209 420,215" stroke="rgba(140,200,255,0.15)" stroke-width="1" fill="none"/>

  <!-- Fishing rod -->
  <line x1="130" y1="35" x2="318" y2="180" stroke="rgba(220,235,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="318" y1="180" x2="318" y2="200" stroke="rgba(140,200,255,0.55)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Hook glow in water -->
  <circle cx="318" cy="206" r="4" fill="rgba(140,200,255,0.7)"/>
  <circle cx="318" cy="206" r="8" fill="none" stroke="rgba(140,200,255,0.25)" stroke-width="1"/>

  <!-- Fish underwater silhouettes -->
  <g opacity="0.35" fill="rgba(100,180,255,0.8)">
    <ellipse cx="190" cy="248" rx="18" ry="8" fill="rgba(100,180,255,0.5)"/>
    <polygon points="172,248 158,242 158,254" fill="rgba(100,180,255,0.5)"/>
    <ellipse cx="380" cy="262" rx="14" ry="6" fill="rgba(100,180,255,0.35)"/>
    <polygon points="366,262 354,257 354,267" fill="rgba(100,180,255,0.35)"/>
    <ellipse cx="480" cy="240" rx="11" ry="5" fill="rgba(100,180,255,0.4)"/>
    <polygon points="469,240 459,236 459,244" fill="rgba(100,180,255,0.4)"/>
  </g>

  <!-- Vignette / text gradient -->
  <rect width="600" height="320" fill="url(#fvign)"/>

  <!-- Title -->
  <text x="300" y="257" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.96">FISHING SYSTEM</text>
  <text x="300" y="280" font-family="'Courier New', Courier, monospace" font-size="12" fill="#7ab8e8" text-anchor="middle" letter-spacing="2" opacity="0.75">MT. TALAMAU · IMAGINATURE STUDIO</text>

  <!-- LIVE badge -->
  <rect x="14" y="14" width="120" height="27" rx="13.5" fill="rgba(63,185,80,0.18)" stroke="rgba(63,185,80,0.45)" stroke-width="1"/>
  <circle cx="28" cy="27.5" r="4.5" fill="#3fb950"/>
  <text x="39" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#3fb950" letter-spacing="0.5">42.4M+ VISITS</text>
</svg>
